<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RizCodeX</title>
<style>
:root{
  --bg:#f4f6f8;--tx:#12171c;--mut:#5b6670;--bd:#dde2e7;
  --wa:#25d366;--wa-d:#128c7e;--wa-tx:#06281a;
  --tt-bk:#010101;--tt-cy:#25f4ee;--tt-rd:#fe2c55;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0d1115;--tx:#eef2f5;--mut:#98a4ae;--bd:#232b33;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0d1115;--tx:#eef2f5;--mut:#98a4ae;--bd:#232b33;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--tx);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;
}
main{width:100%;max-width:460px;padding:32px 20px}
h1{
  font-size:clamp(2.4rem,11vw,3.4rem);line-height:1;margin:0 0 12px;
  font-weight:800;letter-spacing:-.04em;
}
h1 span{color:var(--wa-d)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h1 span{color:var(--wa)}}
:root[data-theme="dark"] h1 span{color:var(--wa)}
p.sub{color:var(--mut);margin:0 0 28px;max-width:34ch}
.choices{display:grid;gap:14px}
.btn{
  display:flex;align-items:center;gap:16px;text-decoration:none;
  padding:18px 20px;border-radius:16px;
  transition:transform .12s ease,box-shadow .12s ease;
}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--tx);outline-offset:3px}
.btn svg{width:40px;height:40px;flex:none}
.btn b{display:block;font-size:1.15rem;line-height:1.2}
.btn small{display:block;font-size:.88rem;opacity:.8;margin-top:2px}

.wa{background:linear-gradient(135deg,var(--wa),#1fb457);color:var(--wa-tx)}
.wa svg{fill:var(--wa-tx)}

.tt{
  background:var(--tt-bk);color:#fff;
  box-shadow:-4px -4px 0 var(--tt-cy),4px 4px 0 var(--tt-rd);
  margin:4px;
}
.tt svg{filter:drop-shadow(-2px -2px 0 var(--tt-cy)) drop-shadow(2px 2px 0 var(--tt-rd))}
.tt:active{box-shadow:-2px -2px 0 var(--tt-cy),2px 2px 0 var(--tt-rd)}

.note{color:var(--mut);font-size:.85rem;margin:26px 0 0}
</style>
</head>
<body>
<main>
  <h1>Riz<span>CodeX</span></h1>
  <p class="sub">Compress video ikut had app yang kau nak hantar. Pilih satu.</p>

  <nav class="choices" aria-label="Pilih app">
    <a class="btn wa" href="https://syarizadnan.github.io/WSRizCodeX/indexWS.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.4-2.3-1.4-.8-.7-1.4-1.6-1.6-1.9-.2-.3 0-.4.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.1c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5 2.5 1 3 .8 3.5.8.6-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>
      <span><b>WhatsApp</b><small>Muat had 10 MB atau 32 MB</small></span>
    </a>

    <a class="btn tt" href="https://syarizadnan.github.io/WSRizCodeX/indexTT.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M19.6 8.1a6.3 6.3 0 0 1-3.7-1.2v6.5a5.6 5.6 0 1 1-5.6-5.6c.3 0 .6 0 .9.1v3a2.6 2.6 0 1 0 1.7 2.5V2h3a3.3 3.3 0 0 0 3.7 3.1v3z"/></svg>
      <span><b>TikTok</b><small>Ikut format dan had TikTok</small></span>
    </a>
  </nav>

  <p class="note">Semua proses berlaku dalam browser kau. Video tak dihantar ke mana-mana.</p>
</main>
</body>
</html>
